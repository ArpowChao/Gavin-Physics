                <section class="summary-section" id="summary-fields">
                    <div class="summary-section-head"><h3>運動與「場」的共同語言</h3><span>先畫狀態，再選公式</span></div>
                    <div class="summary-grid">
                        <article class="summary-note"><h4>運動學：描述，不追原因</h4><p>位置變化形成位移，位移的時變率是速度，速度的時變率是加速度：$v=\\Delta x/\\Delta t$、$a=\\Delta v/\\Delta t$。$v-t$ 圖斜率代表加速度、面積代表位移。</p></article>
                        <article class="summary-note"><h4>動力學：合力造成加速度</h4><p>$\\Sigma F=ma$ 的方向關係比代數更重要。先畫受力圖、定正方向，再列分量式；作用力與反作用力作用在不同物體上，不能互相抵消。</p></article>
                        <article class="summary-note"><h4>重力場</h4><p>質量 $M$ 在空間建立重力場 $g=GM/r^2$，另一質量 $m$ 放入後受力 $F=mg$。場描述「該位置每單位質量受到的力」。</p></article>
                        <article class="summary-note"><h4>電場與磁場</h4><p>電荷建立電場，電荷在電場受力；電流建立磁場，變動磁場又可建立感應電場。法拉第與馬克士威把電、磁與光串成同一套架構。</p></article>
                    </div>
                </section>

                <section class="summary-section" id="summary-waves">
                    <div class="summary-section-head"><h3>波動統整：先分類，再判斷不變量</h3><span>$v=f\\lambda$ 是關係，不代表波速由頻率決定</span></div>
                    <div class="edu-table-container">
                        <table class="edu-table">
                            <thead><tr><th>主題</th><th>判斷核心</th><th>常見實例</th><th>容易混淆處</th></tr></thead>
                            <tbody>
                                <tr><td>力學波／電磁波</td><td>力學波需介質；電磁波可在真空傳播</td><td>聲波、水波／光、無線電波</td><td>波傳遞能量，不把介質整體搬走</td></tr>
                                <tr><td>橫波／縱波</td><td>介質振動方向垂直／平行於傳播方向</td><td>繩波／空氣中的聲波</td><td>水面波不是單純的橫波</td></tr>
                                <tr><td>反射</td><td>同一介質內入射角等於反射角</td><td>回音、鏡面反射</td><td>頻率、波速、波長皆不變</td></tr>
                                <tr><td>折射</td><td>跨介質時頻率不變，波速與波長改變</td><td>光偏折、地震波路徑</td><td>慢介質偏向法線；快介質偏離法線</td></tr>
                                <tr><td>干涉</td><td>同相加強、反相相消</td><td>雙狹縫、薄膜鍍膜</td><td>暗紋仍有波到達，只是疊加相消</td></tr>
                                <tr><td>繞射</td><td>孔寬或障礙物與波長接近時最明顯</td><td>聲音繞牆、X 光晶體繞射</td><td>不是波「轉彎」，而是波前展開</td></tr>
                                <tr><td>都卜勒效應</td><td>接近時接收頻率升高，遠離時降低</td><td>救護車、血流測速、星系紅移</td><td>波源本身頻率不一定改變</td></tr>
                            </tbody>
                        </table>

                <section class="summary-section" id="summary-energy">
                    <div class="summary-section-head"><h3>能量統整：追蹤轉移，而不是背形式</h3><span>總量守恆，但可用程度會下降</span></div>
                    <div class="edu-table-container">
                        <table class="edu-table">
                            <thead><tr><th>能量／速率</th><th>關係式</th><th>系統觀點</th><th>常見情境</th></tr></thead>
                            <tbody>
                                <tr><td>動能</td><td>$K=\\frac12mv^2$</td><td>與運動狀態有關</td><td>煞車、碰撞、滑行</td></tr>
                                <tr><td>重力位能</td><td>$U_g=mgh$</td><td>近地表、選定零位面</td><td>水力發電、拋體</td></tr>
                                <tr><td>彈性位能</td><td>$U_s=\\frac12kx^2$</td><td>儲存在形變的彈性體</td><td>彈簧、弓箭</td></tr>
                                <tr><td>熱量</td><td>$Q=ms\\Delta T$</td><td>因溫差傳遞的能量</td><td>混合熱平衡、加熱</td></tr>
                                <tr><td>功</td><td>$W=F\\Delta x\\cos\\theta$</td><td>力透過位移轉移能量</td><td>起重機、摩擦耗散</td></tr>
                                <tr><td>功率</td><td>$P=W/\\Delta t$、$P_E=IV$</td><td>能量轉換的快慢</td><td>電器額定功率、馬達</td></tr>
                                <tr><td>質能</td><td>$E=\\Delta mc^2$</td><td>核反應的質量虧損轉為能量</td><td>核分裂、太陽核融合</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="summary-grid" style="margin-top:0.9rem;">
                        <article class="summary-note"><h4>守恆不等於「都能再利用」</h4><p>摩擦使機械能轉為分散的內能，總能量仍守恆，但能量品質下降。這是能源效率、廢熱與熱力學第二定律的共同核心。</p></article>
                        <article class="summary-note"><h4>核分裂與核融合</h4><p>分裂是重核裂成中等質量原子核；融合是輕核結合。兩者皆由反應前後的質量差釋能，不是把燃料全部質量轉成能量。</p></article>
                    </div>
                </section>

                    <div class="summary-section-head"><h3>近代物理：每個實驗各證明什麼？</h3><span>現象、控制變因、結論要分開</span></div>

                                <tr><td>雙狹縫與繞射</td><td>出現明暗相間條紋</td><td>光或物質具有波動性</td><td>$\\Delta=n\\lambda$</td></tr>

                    <div class="summary-grid" style="margin-top:0.9rem;">
                        <article class="summary-note"><h4>光電效應兩組變因</h4><ul><li>提高頻率：光電子最大動能增加。</li><li>提高強度：單位時間光子數增加，光電流變大。</li><li>低於底限頻率：再強、照再久都沒有光電子。</li></ul></article>
                        <article class="summary-note"><h4>波粒二象性</h4><p>不是物體有時「變成」波、有時「變成」粒子，而是同一量子系統在不同實驗安排下呈現不同可觀察特徵；物質波描述位置機率分布。</p></article>

        function contextColumnHtml(column) {
            const formulas = column.formulas.map(item => `<span class="context-formula">${item}</span>`).join('');
            const traps = column.traps.map(item => `<li>${item}</li>`).join('');
            const nodes = column.nodes.map(id => `<button class="context-node-btn" type="button" onclick="openContextNode('${id}')">${nodeLabel(id)}</button>`).join('');

            return `
                <article class="context-card" data-tone="${column.tone}">
                    <div class="context-card-content">
                        <div class="context-card-left">
                            <div class="context-card-head">
                                <div><div class="context-domain">${column.domain}</div><h3>${column.title}</h3></div>

        // 各節點掌握度：彙整題庫與歷屆試題的作答紀錄（一題掛多節點時同時計入各節點）
        function nodeMasteryMap() {
            const map = {};
            [studyRecords.bank, studyRecords.exam].forEach(store => {
                Object.values(store).forEach(rec => {
                    (rec.nodes || []).forEach(id => {
                        const m = map[id] || (map[id] = { a: 0, c: 0 });
                        m.a += rec.a;
                        m.c += rec.c;
                    });
                });
            });
            return map;
        }
        function masteryCellHtml(m) {
            if (!m || m.a === 0) return '<span class="mastery-none">未作答</span>';
            const pct = Math.round(m.c / m.a * 100);
            const cls = pct >= 80 ? 'mastery-good' : pct >= 60 ? 'mastery-mid' : 'mastery-low';
            return `<span class="${cls}">${pct}%</span><br><span style="font-size:0.72rem; color:var(--text-muted); font-weight:500;">${m.c}/${m.a} 次</span>`;
        }

        function renderStatsView() {
            currentView = 'stats';
            const main = document.getElementById('main-content');

            // Calculate total questions dynamically for each node based on show99
            const mastery = nodeMasteryMap();
            const sorted = [...knowledgeNodes].map(n => {
                const { c108, reference108, c99 } = nodeExamCounts(n.id);
                const total = c108 + (show99 ? c99 : 0);
                const modTitle = modulesData[n.module] ? modulesData[n.module].title.split('：')[1] : '';
                const m = mastery[n.id] || { a: 0, c: 0 };
                return { ...n, c108, reference108, c99, total, modTitle, mast: m };
            });

            // Sort nodes dynamically
            sorted.sort((a, b) => {
                let valA, valB;
                if (statsSortKey === 'code') {
                    valA = a.code; valB = b.code;
                } else if (statsSortKey === 'name') {
                    valA = a.name; valB = b.name;
                } else if (statsSortKey === 'module') {
                    valA = a.module; valB = b.module;
                } else if (statsSortKey === 'exam5y') {
                    valA = a.c108; valB = b.c108;
                } else { // 'total'
                    valA = a.total; valB = b.total;
                }

                if (valA < valB) return statsSortDesc ? 1 : -1;
                if (valA > valB) return statsSortDesc ? -1 : 1;

                return a.id.localeCompare(b.id);
            });

            let rowsHtml = '';
            sorted.forEach((n, idx) => {
                let link;
                if (n.total === 0) {
                    link = `<div class="stats-exam-none">（歷屆此節點多以觀念判斷題出現，另見題庫）</div>`;

                } else {
                    link = `<div class="stats-exam-link">📚 99 課綱歷屆 ${n.c99} 題（點擊後自動納入顯示）→</div>`;
                }
                rowsHtml += `
                    <tr ${n.total > 0 ? `class="stats-row-click" onclick="showExamsForNode('${n.id}')" title="檢視此節點的歷屆試題"` : ''}>

        function bankSelect(uid, idx) {
            if (bankDone[uid]) return;
            const q = bankIndex[uid];

            if (q.type === 'multi') {

        function paintBankResult(uid) {
            const q = bankIndex[uid];
            const sel = bankSel[uid];
            if (!q || !sel) return;
            const correctSet = new Set(q.opts.map((o, i) => o.c ? i : -1).filter(i => i >= 0));
            const isCorrect = sel.size === correctSet.size && [...sel].every(i => correctSet.has(i));

        function nodeExamCounts(nodeId) {

        // ===== 歷屆題分類校對器：人工確認所有相關考點，結果存於本機 =====
        const TAXONOMY_REVIEW_KEY = 'physics-taxonomy-review-v1';
        let taxonomyReviewState = loadTaxonomyReviewState();
        let taxonomyActiveKey = null;
        let taxonomyFilter = { year: 'all', status: 'all', query: '' };
        reconcileTaxonomyReviewState();

        function taxonomyExamKey(exam) {
            return `${exam.year}:${exam.q}`;
        }

        function taxonomyEscapeHtml(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function loadTaxonomyReviewState() {
            try {
                const parsed = JSON.parse(localStorage.getItem(TAXONOMY_REVIEW_KEY));
                if (parsed && parsed.version === 1 && parsed.items && typeof parsed.items === 'object') return parsed;
            } catch (error) {
                // 無痕模式或舊資料格式無法讀取時，從空白校對狀態開始。
            }
            return { version: 1, updatedAt: null, items: {} };
        }

        function saveTaxonomyReviewState() {
            taxonomyReviewState.updatedAt = new Date().toISOString();
            try {
                localStorage.setItem(TAXONOMY_REVIEW_KEY, JSON.stringify(taxonomyReviewState));
            } catch (error) {
                showTaxonomyToast('瀏覽器無法保存資料，請先下載校對檔。');
            }
        }

        function taxonomyNodesEqual(a, b) {
            return Array.isArray(a) && Array.isArray(b) && a.length === b.length && a.every(id => b.includes(id));
        }

        function reconcileTaxonomyReviewState() {
            let changed = false;
            examPractice.forEach(exam => {
                const item = taxonomyReviewState.items[taxonomyExamKey(exam)];
                if (
                    item?.status === 'correction'
                    && !taxonomyNodesEqual(item.sourceNodes, exam.nodes)
                    && taxonomyNodesEqual(item.proposedNodes, exam.nodes)
                ) {
                    item.status = 'confirmed';
                    item.sourceNodes = [...exam.nodes];
                    item.updatedAt = new Date().toISOString();
                    changed = true;
                }
            });
            if (changed) saveTaxonomyReviewState();
        }

        function taxonomyStoredReview(exam) {
            return taxonomyReviewState.items[taxonomyExamKey(exam)] || null;
        }

        function taxonomyProposal(exam) {
            const stored = taxonomyStoredReview(exam);
            const validIds = new Set(knowledgeNodes.map(n => n.id));
            const source = stored && Array.isArray(stored.proposedNodes) ? stored.proposedNodes : exam.nodes;
            const unique = [...new Set(source.filter(id => validIds.has(id)))];
            if (unique.length === 0) unique.push(exam.nodes[0]);
            return unique;
        }

        function taxonomyStatus(exam) {
            return taxonomyStoredReview(exam)?.status || 'unreviewed';
        }

        function taxonomyStatusLabel(status) {
            return {
                confirmed: '分類正確',
                correction: '需要修正',
                draft: '尚未送出',
                unreviewed: '待校對'
            }[status] || '待校對';
        }

        function taxonomySaveItem(exam, status, proposedNodes, note) {
            taxonomyReviewState.items[taxonomyExamKey(exam)] = {
                status,
                sourceNodes: [...exam.nodes],
                proposedNodes: [...proposedNodes],
                note: String(note || ''),
                updatedAt: new Date().toISOString()
            };
            saveTaxonomyReviewState();
        }

        function taxonomyFilteredExams() {
            const query = taxonomyFilter.query.trim().toLowerCase();
            return examPractice.filter(exam => {
                if (taxonomyFilter.year !== 'all' && exam.year !== taxonomyFilter.year) return false;
                const status = taxonomyStatus(exam);
                if (taxonomyFilter.status === 'unreviewed' && (status === 'confirmed' || status === 'correction')) return false;
                if (taxonomyFilter.status !== 'all' && taxonomyFilter.status !== 'unreviewed' && status !== taxonomyFilter.status) return false;
                if (query) {
                    const labels = exam.nodes.map(nodeLabel).join(' ');
                    const haystack = `${exam.year} ${exam.q} ${exam.topic} ${labels}`.toLowerCase();
                    if (!haystack.includes(query)) return false;
                }
                return true;
            });
        }

        function taxonomyNodePickerHtml(proposedNodes) {
            const selectedNodes = new Set(proposedNodes);
            return Object.keys(modulesData).map(Number).sort((a, b) => a - b).map(moduleNum => {

                    return `

        function taxonomyCurrentChips(exam) {

            const key = taxonomyExamKey(exam);

                    <span class="taxonomy-status-dot ${status}"></span>

                        <span>${taxonomyEscapeHtml(exam.topic)}</span>
                    </span>
                </button>

            const statuses = examPractice.map(taxonomyStatus);
            const confirmed = statuses.filter(status => status === 'confirmed').length;
            const correction = statuses.filter(status => status === 'correction').length;

                total: examPractice.length,

            if (current) {

                const info = examPapers[current.year];

                workbenchHtml = `

        function taxonomyCurrentExam() {
            return examPractice.find(exam => taxonomyExamKey(exam) === taxonomyActiveKey) || null;
        }

        function taxonomySelectExam(key) {
            taxonomyActiveKey = key;
            renderTaxonomyReviewView();
        }

        function taxonomySetFilter(key, value) {
            taxonomyFilter[key] = value;
            taxonomyActiveKey = null;
            renderTaxonomyReviewView();
        }

        function taxonomyToggleNode(nodeId) {
            const exam = taxonomyCurrentExam();
            if (!exam || !knowledgeNodes.some(node => node.id === nodeId)) return;
            const selected = new Set(taxonomyProposal(exam));
            if (selected.has(nodeId) && selected.size === 1) {
                showTaxonomyToast('每題至少需要保留一個相關節點。');
                return;
            }
            if (selected.has(nodeId)) selected.delete(nodeId);
            else selected.add(nodeId);
            const orderedNodes = knowledgeNodes.map(node => node.id).filter(id => selected.has(id));
            const note = taxonomyStoredReview(exam)?.note || document.getElementById('taxonomy-note')?.value || '';
            taxonomySaveItem(exam, 'draft', orderedNodes, note);
            renderTaxonomyReviewView();
        }

        function taxonomyUpdateNote(value) {
            const exam = taxonomyCurrentExam();
            if (!exam) return;
            taxonomySaveItem(exam, 'draft', taxonomyProposal(exam), value);
            const state = document.getElementById('taxonomy-review-state');
            if (state) {
                state.className = 'taxonomy-review-state draft';
                state.textContent = taxonomyStatusLabel('draft');
            }
        }

        function taxonomyNextKeyAfter(currentKey) {
            const currentIndex = examPractice.findIndex(exam => taxonomyExamKey(exam) === currentKey);
            const candidates = taxonomyFilteredExams();
            const next = candidates.find(exam => examPractice.indexOf(exam) > currentIndex) || candidates[0] || null;
            return next ? taxonomyExamKey(next) : null;
        }

        function taxonomyMarkConfirmed() {
            const exam = taxonomyCurrentExam();
            if (!exam) return;
            const note = document.getElementById('taxonomy-note')?.value || '';
            const oldKey = taxonomyExamKey(exam);
            taxonomySaveItem(exam, 'confirmed', [...exam.nodes], note);
            taxonomyActiveKey = taxonomyNextKeyAfter(oldKey);
            showTaxonomyToast(`${exam.year} 第 ${exam.q} 題：已確認分類正確`);
            renderTaxonomyReviewView();
        }

        function taxonomyMarkCorrection() {
            const exam = taxonomyCurrentExam();
            if (!exam) return;
            const proposed = taxonomyProposal(exam);
            const note = document.getElementById('taxonomy-note')?.value.trim() || '';
            const unchanged = taxonomyNodesEqual(proposed, exam.nodes);
            if (unchanged && !note) {
                showTaxonomyToast('請先修改相關節點，或寫下錯誤原因。');
                return;
            }
            const oldKey = taxonomyExamKey(exam);
            taxonomySaveItem(exam, 'correction', proposed, note);
            taxonomyActiveKey = taxonomyNextKeyAfter(oldKey);
            showTaxonomyToast(`${exam.year} 第 ${exam.q} 題：已加入修正清單`);
            renderTaxonomyReviewView();
        }

        function taxonomyMove(delta) {
            const list = taxonomyFilteredExams();
            if (!list.length) return;
            const index = Math.max(0, list.findIndex(exam => taxonomyExamKey(exam) === taxonomyActiveKey));
            taxonomyActiveKey = taxonomyExamKey(list[(index + delta + list.length) % list.length]);
            renderTaxonomyReviewView();
        }

        function taxonomyExportRecords() {
            return examPractice.map(exam => {
                const stored = taxonomyStoredReview(exam);
                if (!stored) return null;
                return {
                    year: exam.year,
                    question: exam.q,
                    topic: exam.topic,
                    status: stored.status,
                    currentNodes: [...exam.nodes],
                    proposedNodes: [...stored.proposedNodes],
                    note: stored.note || '',
                    updatedAt: stored.updatedAt
                };
            }).filter(Boolean);
        }

        function taxonomyCodexText() {
            const corrections = taxonomyExportRecords().filter(record => record.status === 'correction');
            if (!corrections.length) return '歷屆題分類校對結果：目前沒有標記「需要修正」的題目。';
            const lines = [
                '請依照以下人工校對結果修正 data/examPractice.js 的 nodes 分類。',
                '規則：proposedNodes 內全部都是相關考點，不分主次。',
                ''
            ];
            corrections.forEach((record, index) => {
                lines.push(`${index + 1}. ${record.year} 學測第 ${record.question} 題｜${record.topic}`);
                lines.push(`   - 目前：${record.currentNodes.join(', ')}`);
                lines.push(`   - 建議：${record.proposedNodes.join(', ')}`);
                if (record.note) lines.push(`   - 備註：${record.note}`);
            });
            return lines.join('\n');
        }

        async function copyTaxonomyCorrections() {
            const text = taxonomyCodexText();
            try {
                await navigator.clipboard.writeText(text);
            } catch (error) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                textarea.remove();
            }
            showTaxonomyToast('已複製修正清單，直接貼到 Codex 對話即可。');
        }

        function downloadTaxonomyReview() {
            const payload = {
                schema: 'phy-senior-taxonomy-review-v1',
                exportedAt: new Date().toISOString(),
                summary: taxonomySummaryCounts(),
                records: taxonomyExportRecords()
            };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
            const link = document.createElement('a');
            const downloadUrl = URL.createObjectURL(blob);
            link.href = downloadUrl;
            link.download = `phy-senior-taxonomy-review-${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
            showTaxonomyToast('已下載校對檔，可直接上傳給 Codex。');
        }

            document.querySelector('.taxonomy-toast')?.remove();

            toast.className = 'taxonomy-toast';
            toast.setAttribute('role', 'status');
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2600);

        // ===== 15 分鐘診斷卷 =====
        // 首頁一直叫學生「先找弱點」，但掌握度要做完整個題庫才有數字，

        // 這裡用「近五年考幾組」加權挑題，15 題內問出最該補的節點。
        function pickDiagnosticSet(limit) {
            limit = limit || 15;
            const scored = knowledgeNodes.map(n => ({ n, freq: nodeExamCounts(n.id).c108 }))
                .filter(x => x.freq > 0)
                .sort((a, b) => b.freq - a.freq);
            const picked = [];
            // 高頻節點優先，每個節點取一題；偏好「應用／分析」這種有鑑別度的層次
            scored.forEach(({ n }) => {
                if (picked.length >= limit) return;
                const pool = questionBank.filter(q => q.node === n.id && q.type !== 'short');
                if (!pool.length) return;
                const best = pool.find(q => q.level === '應用') || pool.find(q => q.level === '分析') || pool[0];
                picked.push(best);
            });
            return picked;
        }

        let diagnoseSet = [];

                ${bankKeys.length > 0 ? `<div class="edu-card"><div class="edu-card-title">✏️ 題庫錯題（${bankKeys.length} 題）——重新作答，答對即移出</div>${bankHtml}</div>` : ''}

        function exportRecords() {
            const stamp = new Date().toISOString().slice(0, 10).replace(/-/g, '');
            const blob = new Blob([JSON.stringify(studyRecords, null, 1)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `gsat-phy-records-${stamp}.json`;
            a.click();
            URL.revokeObjectURL(a.href);
        }

        function importRecords(input) {
            const file = input.files && input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const data = JSON.parse(reader.result);
                    if (!data || typeof data.bank !== 'object' || typeof data.exam !== 'object') throw new Error('格式不符');
                    if (!confirm('匯入將「覆蓋」目前的做題紀錄，確定嗎？（建議先匯出備份）')) return;
                    studyRecords.bank = data.bank;
                    studyRecords.exam = data.exam;
                    saveRecords();
                    updateWrongNavBadge();
                    renderWrongView();
                } catch (e) {
                    alert('匯入失敗：檔案不是有效的紀錄備份（' + e.message + '）');
                } finally {
                    input.value = '';
                }
            };
            reader.readAsText(file);
        }

        function clearRecords() {
            if (!confirm('確定清空全部做題紀錄？此動作無法復原（建議先匯出備份）。')) return;
            studyRecords.bank = {};
            studyRecords.exam = {};
            saveRecords();
            updateWrongNavBadge();
            renderWrongView();
        }

        function toggleExamItem(btn) {
            const item = btn.closest('.exam-item');
            const body = item.querySelector('.exam-body');
            const isOpening = !item.classList.contains('open');

            // Close other open exam items
            document.querySelectorAll('.exam-item.open').forEach(openItem => {
                if (openItem !== item) {
                    openItem.classList.remove('open');
                    openItem.querySelector('.exam-body').style.maxHeight = '0px';
                }

                item.classList.add('open');
                body.style.maxHeight = body.scrollHeight + 'px';

                // 自動初始化展開題目的 Canvas 繪圖板
                const canvases = body.querySelectorAll('.draw-canvas');
                canvases.forEach(canvas => {
                    const uid = canvas.getAttribute('id').replace('canvas-', '');
                    const sheet = canvas.getAttribute('data-sheet');
                    setTimeout(() => {
                        initCanvas(uid, sheet);
                        body.style.maxHeight = body.scrollHeight + 'px';
                    }, 100); // 延長到 100ms 確保過渡動畫開始並有 clientWidth
                });

                item.classList.remove('open');
                body.style.maxHeight = '0px';
            }
        }

        // ===== 做題紀錄（localStorage）：錯題本與掌握度的資料層 =====
        const REC_KEY = 'gsat-phy-records-v1';
        function loadRecords() {
            try {
                const raw = JSON.parse(localStorage.getItem(REC_KEY));
                if (raw && raw.bank && raw.exam) return raw;
            } catch (e) { /* 壞資料視同無紀錄 */ }
            return { bank: {}, exam: {} };
        }
        const studyRecords = loadRecords();
        function saveRecords() {
            try { localStorage.setItem(REC_KEY, JSON.stringify(studyRecords)); } catch (e) { /* 無痕模式等情況下略過 */ }
        }
        // 題庫題的穩定鍵：節點｜層次｜題幹雜湊（不用陣列序號，避免題庫增刪造成紀錄錯位）
        function bankKey(q) {
            let h = 5381;
            const s = q.q || '';
            for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
            return q.node + '|' + q.level + '|' + h.toString(36);
        }
        let _bankKeyMap = null;
        function bankByKey(key) {
            if (!_bankKeyMap) {
                _bankKeyMap = {};
                questionBank.forEach(q => { _bankKeyMap[bankKey(q)] = q; });
            }
            return _bankKeyMap[key];
        }
        // kind: 'bank' | 'exam'；nodes: 字串或陣列（掌握度統計歸屬的知識節點）
        function recordResult(kind, key, ok, nodes) {
            const store = studyRecords[kind];
            const rec = store[key] || (store[key] = { a: 0, c: 0, last: 0, t: 0, nodes: [] });
            rec.a++;
            if (ok) rec.c++;
            rec.last = ok ? 1 : -1;
            rec.t = Date.now();
            if (nodes) rec.nodes = Array.isArray(nodes) ? nodes : [nodes];
            saveRecords();
            updateWrongNavBadge();
        }
        // 錯題清單：last === -1（最近一次答錯）且題目仍存在
        function wrongBankKeys() {
            return Object.keys(studyRecords.bank).filter(k => studyRecords.bank[k].last === -1 && bankByKey(k));
        }
        function wrongExamKeys() {
            const set = new Set();
            Object.keys(studyRecords.exam).forEach(k => {
                if (studyRecords.exam[k].last !== -1) return;
                const base = k.split('#')[0];
                if (examPractice.some(e => e.year + '_' + e.q === base)) set.add(base);
            });
            return [...set];
        }
        function updateWrongNavBadge() {
            const el = document.getElementById('wrong-nav-badge');
            if (!el) return;
            const n = wrongBankKeys().length + wrongExamKeys().length;
            el.style.display = n > 0 ? 'inline-block' : 'none';
            el.textContent = n;
        }
        // 自評按鈕列（簡答／非選共用）：作答後由學生對照參考答案自我評量
        function selfGradeRowHtml(handler) {
            return `
                <div class="self-grade">
                    <span class="self-grade-label">對照後自我評量：</span>
                    <button type="button" onclick="${handler}, true)">✅ 我答對了</button>
                    <button type="button" onclick="${handler}, false)">✍️ 我需加強</button>
                </div>`;
        }
        function selfGradeDone(btn, ok) {
            const row = btn.closest('.self-grade');
            row.innerHTML = `<span class="sg-done" style="color:${ok ? 'var(--accent-green, #059669)' : 'var(--accent-rose, #e11d48)'};">${ok ? '✅ 已記錄：答對' : '✍️ 已記錄：列入錯題本'}</span>`;
        }
        function selfGradeBank(btn, uid, ok) {
            const q = bankIndex[uid];
            if (!q) return;
            recordResult('bank', bankKey(q), ok, q.node);
            selfGradeDone(btn, ok);
        }
        function selfGradeExam(btn, key, ok) {
            const entry = examPractice.find(e => e.year + '_' + e.q === key);
            recordResult('exam', key + '#ns', ok, entry ? entry.nodes : []);
            selfGradeDone(btn, ok);
            resizeExamBody(btn);
        }

        // ===== 歷屆試題選擇題作答邏輯與狀態 =====
        const examMCSel = {};
        const examMCGraded = {}; // 防止同一次作答因重複開合詳解而重複記錄

        function parseExamAnswers(ansStr) {
            const results = [];
            let str = (ansStr || '').trim();

            // 匹配子題 (如 Q1：(B)、Q22：(CE)、Q51：非選)
            const subMatches = [...str.matchAll(/(Q\d+|第\s*\d+[-~、]\s*\d+\s*題|第\s*\d+\s*題|Q\d+參)\s*[：:]\s*(非選|\([A-E]+\))/g)];
            if (subMatches.length > 0) {
                subMatches.forEach(m => {
                    const label = m[1];
                    const ansVal = m[2];
                    if (ansVal.startsWith('(')) {
                        const letters = ansVal.replace(/[\(\)]/g, '').split('');
                        results.push({ label, isMC: true, ans: letters });
                    } else {
                        results.push({ label, isMC: false, ans: [] });
                    }
                });
            } else {
                // 單一題目，匹配 (B) 或 (DE)
                const mcMatch = str.match(/^\s*\(([A-E]+)\)/);
                if (mcMatch) {
                    const letters = mcMatch[1].split('');
                    results.push({ label: '', isMC: true, ans: letters });
                } else {
                    results.push({ label: '', isMC: false, ans: [] });
                }
            }
            return results;
        }

        function toggleExamMC(btn, key, qIdx, opt) {
            const item = btn.closest('.exam-item');
            const solBox = item.querySelector('.exam-sol');
            if (solBox && !solBox.hasAttribute('hidden')) return; // 已公布答案時禁止更改

            if (!examMCSel[key]) examMCSel[key] = {};
            if (!examMCSel[key][qIdx]) examMCSel[key][qIdx] = new Set();

            const sel = examMCSel[key][qIdx];
            if (sel.has(opt)) {
                sel.delete(opt);
                btn.classList.remove('selected');
            } else {
                sel.add(opt);
                btn.classList.add('selected');
            }
        }

        function checkExamMC(key, itemEl) {
            const s = examSolutions[key];
            if (!s) return;
            const mcQuestions = parseExamAnswers(s.ans);
            const selections = examMCSel[key] || {};

            mcQuestions.forEach((q, qIdx) => {
                if (!q.isMC) return;

                const sel = selections[qIdx] || new Set();
                const correctSet = new Set(q.ans);
                const isCorrect = sel.size === correctSet.size && [...sel].every(opt => correctSet.has(opt));

                // 記錄「已計分的那組答案」而非單純的布林旗標：
                // 用布林會讓學生在錯題本重做、即使改對了也不再計分，錯題永遠移不掉。
                // 改存答案簽章後：答案有變 → 重新計分；只是反覆開合詳解 → 不重複計。
                const gKey = key + '#' + qIdx;
                const sig = [...sel].sort().join('');
                if (sel.size > 0 && examMCGraded[gKey] !== sig) {
                    examMCGraded[gKey] = sig;
                    const entry = examPractice.find(x => x.year + '_' + x.q === key);
                    recordResult('exam', gKey, isCorrect, entry ? entry.nodes : []);
                }

                const row = itemEl.querySelector(`#exam-mc-row-${key}-${qIdx}`);
                if (row) {
                    ['A', 'B', 'C', 'D', 'E'].forEach(opt => {
                        const optBtn = row.querySelector(`[data-opt="${opt}"]`);
                        if (optBtn) {
                            optBtn.classList.remove('selected');
                            if (correctSet.has(opt)) {
                                optBtn.classList.add('correct');
                            } else if (sel.has(opt)) {
                                optBtn.classList.add('incorrect');
                            }
                        }
                    });

                    const resultText = row.querySelector(`#exam-mc-result-${key}-${qIdx}`);
                    if (resultText) {
                        resultText.style.display = 'inline-block';
                        if (isCorrect) {
                            resultText.style.color = 'var(--accent-green)';
                            resultText.innerHTML = '🎉 答對了！';
                        } else {
                            resultText.style.color = 'var(--accent-rose)';
                            resultText.innerHTML = `❌ 答錯（正確答案：${q.ans.join('')}）`;
                        }
                    }
                }
            });
        }

        function resetExamMC(key, itemEl) {
            const s = examSolutions[key];
            if (!s) return;
            const mcQuestions = parseExamAnswers(s.ans);

            if (examMCSel[key]) {
                mcQuestions.forEach((q, qIdx) => {
                    if (examMCSel[key][qIdx]) examMCSel[key][qIdx].clear();
                });
            }
            mcQuestions.forEach((q, qIdx) => { delete examMCGraded[key + '#' + qIdx]; });

            mcQuestions.forEach((q, qIdx) => {
                if (!q.isMC) return;
                const row = itemEl.querySelector(`#exam-mc-row-${key}-${qIdx}`);
                if (row) {
                    ['A', 'B', 'C', 'D', 'E'].forEach(opt => {
                        const optBtn = row.querySelector(`[data-opt="${opt}"]`);
                        if (optBtn) optBtn.classList.remove('correct', 'incorrect', 'selected');
                    });
                    const resultText = row.querySelector(`#exam-mc-result-${key}-${qIdx}`);
                    if (resultText) {
                        resultText.style.display = 'none';
                        resultText.textContent = '';
                    }
                }
            });
        }

        // 升級版手寫與繪圖作答區（支援 canvas 手繪與答題紙底圖）
        function handwriteBox(label, uid, sheetFile = '') {

                    ${!sheetFile ? `<button class="canvas-tool-btn" id="toggle-mode-btn-${uid}" onclick="toggleWritingMode('${uid}')" style="padding:0.2rem 0.5rem; font-size:0.75rem;">✍️ 切換手寫板</button>` : ''}
                </div>

                <!-- 預設打字輸入框（適用於一般文字非選題） -->
                <textarea class="bank-short-input" id="handwrite-text-${uid}" rows="4" placeholder="請先在此寫下你的作答，或點擊右上角切換至「手寫板」用觸控筆／滑鼠作答..." style="width:100%; border:1px solid var(--border-color); border-radius:6px; padding:0.5rem; font-family:inherit; font-size:0.88rem; outline:none; resize:vertical; display:${sheetFile ? 'none' : 'block'};"></textarea>

                <!-- 繪圖畫布板（有答題紙底圖時預設顯示，無底圖時手寫板顯示） -->
                <div class="canvas-board-wrap" id="board-wrap-${uid}" style="display:${sheetFile ? 'block' : 'none'};">
                    <div class="canvas-toolbar">

                        <button class="canvas-tool-btn" data-tool="eraser" onclick="setCanvasTool('${uid}', 'eraser')">🧽 橡皮擦</button>

                    <canvas id="canvas-${uid}" class="draw-canvas" data-sheet="${sheetFile}" aria-label="${label}" ${style}>此區為${label}；若瀏覽器無法使用畫布，請改用文字輸入或紙筆作答。</canvas>
                </div>
                </div>
            </div>`;
        }

        const EXAM_SHEET_ANSWERS = Object.freeze({
            '111_51_sheet.png': '111_51_ans.png',
            '113_46_sheet.png': '113_46_ans.png',
            '115_49_sheet.png': '115_49_ans.png',
            '115_53_sheet.png': '115_53_ans.png'
        });

        // 歷屆題的「答案與詳解」區塊（非選附手寫作答區與 CER 結構，選擇題附作答按鈕）
        function examSolBlock(e) {
            const key = e.year + '_' + e.q;
            const s = examSolutions[key];
            if (!s) return '';
            const isHand = Boolean(s.hand);
            const sheetFile = s.sheet || '';
            const hand = isHand ? handwriteBox(sheetFile ? '答題卷作答區（請直接在底圖格線上作答／手繪）' : '非選作答區（可打字或手寫）', key, sheetFile) : '';

            // 一般選擇題才顯示選項作答；手寫題組直接進入非選參考答案與評分規準。
            const mcQuestions = parseExamAnswers(s.ans);
            let mcHtml = '';
            let hasMC = false;

            mcQuestions.forEach((q, qIdx) => {
                if (q.isMC && !isHand) {
                    hasMC = true;
                    let optionsButtons = '';
                    ['A', 'B', 'C', 'D', 'E'].forEach(opt => {
                        optionsButtons += `
                            <button class="exam-opt-btn" data-opt="${opt}" onclick="toggleExamMC(this, '${key}', ${qIdx}, '${opt}')">${opt}</button>
                        `;
                    });

                    const qTitle = q.label ? `${q.label}作答：` : '選擇題作答：';
                    mcHtml += `
                        <div class="exam-mc-row" id="exam-mc-row-${key}-${qIdx}">
                            <span class="exam-mc-qtitle">${qTitle}</span>
                            <div class="exam-mc-options">${optionsButtons}</div>
                            <span class="exam-mc-result" id="exam-mc-result-${key}-${qIdx}" style="display:none; font-weight:700; margin-left:0.5rem; font-size:0.88rem;"></span>
                        </div>
                    `;
                }
            });

            let mcSection = '';
            if (hasMC) {
                mcSection = `
                    <div class="exam-mc-section">
                        <div class="handwrite-label" style="margin-bottom:0.4rem; color:var(--primary-blue); font-size:0.88rem;">✏️ 選擇題作答區（點選作答，點「顯示答案與詳解」時自動核對）</div>
                        ${mcHtml}
                    </div>
                `;
            }

            // 如果是手繪題，動態在答案區最上方渲染官方手繪滿分答案圖
            const answerSheetFile = EXAM_SHEET_ANSWERS[sheetFile] || '';
            const ansImg = answerSheetFile ? `
                <div style="margin: 0.5rem 0.9rem 0.75rem 0.9rem; padding-bottom: 0.75rem; border-bottom: 1px dashed var(--border-color);">
                    <div style="font-weight:700; color:#047857; font-size:0.85rem; margin-bottom:0.5rem; display:flex; align-items:center; gap:0.25rem;">
                        <span>🎯</span> 官方答題卷手繪滿分答案示範：
                    </div>
                    <img class="exam-crop ${invertCrops ? 'inverted' : ''}" loading="lazy" src="assets/exam_crops/${answerSheetFile}" style="max-width:100%; border:1px solid var(--border-color); border-radius:6px;" alt="手繪題官方答案圖">
                </div>
            ` : '';

            const rubricTitle = s.rubricTitle || '官方評分規準';
            const rubricItems = Array.isArray(s.rubric) ? s.rubric.map(item => `
                <div class="exam-rubric-item">
                    <span class="exam-rubric-score">${item.score}</span>
                    <span>${item.text}</span>
                </div>
            `).join('') : '';
            const rubricUrl = encodeURI(examPapers[e.year]?.rubric || '');
            const rubricSourceLabel = e.year === '111參'
                ? '📄 開啟官方參考答案 PDF'
                : '📄 開啟官方非選擇題參考答案與評分原則 PDF';
            const handAssessment = isHand ? `
                <div class="exam-hand-answer">
                    <div class="exam-hand-answer-head">
                        <span>📝 滿分參考答案</span>
                    </div>
                    <div class="exam-hand-answer-body">${s.handAns || s.ans}</div>
                </div>
                ${ansImg}
                <div class="exam-rubric">
                    <div class="exam-rubric-head">
                        <span>🎯 ${rubricTitle}</span>
                        ${Number.isFinite(s.score) ? `<span class="exam-rubric-total">滿分 ${s.score} 分</span>` : ''}
                    </div>
                    <div class="exam-rubric-list">${rubricItems}</div>
                    ${rubricUrl ? `<a class="exam-rubric-source" href="${rubricUrl}" target="_blank" rel="noopener">${rubricSourceLabel} →</a>` : ''}
                </div>
            ` : '';
            const revealLabel = isHand ? '📋 顯示參考答案與評分規準' : '📖 顯示答案與詳解';

            return `
                ${hand}
                ${mcSection}
                <div class="exam-sol-wrap">
                    <button class="exam-sol-btn" onclick="toggleExamSol(this, '${key}')">${revealLabel}</button>
                    <div class="exam-sol" hidden>
                        ${isHand ? handAssessment : `
                            <div class="exam-ans">✅ 答案：${s.ans}</div>
                            <div class="exam-detail">${s.sol}</div>
                        `}
                        ${isHand ? selfGradeRowHtml(`selfGradeExam(this, '${key}'`) : ''}
                    </div>
                </div>`;
        }

        function resizeExamBody(el) {
            const body = el.closest('.exam-body');
            const item = el.closest('.exam-item');
            if (body && item && item.classList.contains('open')) {
                body.style.maxHeight = body.scrollHeight + 'px';
            }
        }

        // ===== 全域 Canvas 繪圖板控制邏輯 =====
        const canvasStates = {};

        function disposeCanvasState(uid) {
            const state = canvasStates[uid];
            if (!state) return;
            if (state.resizeHandler) {
                window.removeEventListener('resize', state.resizeHandler);
            }
            state.isDrawing = false;
            delete canvasStates[uid];
        }

        function disposeAllCanvasStates() {
            Object.keys(canvasStates).forEach(disposeCanvasState);
        }

        function initCanvas(uid, sheetFile) {
            const canvas = document.getElementById(`canvas-${uid}`);
            if (!canvas) return;

            const existingState = canvasStates[uid];
            // 清單重新渲染後會出現同 id 的新元素，舊狀態不可繼續指向已移除的畫布。
            if (existingState && existingState.canvas !== canvas) {
                disposeCanvasState(uid);
            }

            // 若此畫布尚未註冊狀態，進行註冊
            if (!canvasStates[uid]) {
                const state = {
                    canvas: canvas,
                    ctx: canvas.getContext('2d'),
                    isDrawing: false,
                    tool: 'pen',
                    lastX: 0,
                    lastY: 0,
                    sheetFile: sheetFile,
                    sheetRatio: 2.5,
                    resizeHandler: null
                };
                canvasStates[uid] = state;

                // 綁定事件（僅綁定一次）
                canvas.addEventListener('mousedown', (e) => startDrawing(e, uid));
                canvas.addEventListener('mousemove', (e) => draw(e, uid));
                canvas.addEventListener('mouseup', () => stopDrawing(uid));
                canvas.addEventListener('mouseout', () => stopDrawing(uid));

                // 觸控事件相容
                canvas.addEventListener('touchstart', (e) => {
                    const touch = e.touches[0];
                    const mouseEvent = new MouseEvent('mousedown', {
                        clientX: touch.clientX,
                        clientY: touch.clientY
                    });
                    canvas.dispatchEvent(mouseEvent);
                    e.preventDefault();
                }, { passive: false });

                canvas.addEventListener('touchmove', (e) => {
                    const touch = e.touches[0];
                    const mouseEvent = new MouseEvent('mousemove', {
                        clientX: touch.clientX,
                        clientY: touch.clientY
                    });
                    canvas.dispatchEvent(mouseEvent);
                    e.preventDefault();
                }, { passive: false });

                canvas.addEventListener('touchend', () => {
                    const mouseEvent = new MouseEvent('mouseup', {});
                    canvas.dispatchEvent(mouseEvent);
                });

                // 監聽視窗大小改變，自動調整 canvas 比例
                state.resizeHandler = () => {
                    if (canvasStates[uid] === state && canvas.isConnected) {
                        resizeCanvas(uid);
                    }
                };
                window.addEventListener('resize', state.resizeHandler);

                // 依答案卡底圖的原始尺寸設定畫布比例，避免不同年度作答區被壓扁或裁切。
                if (sheetFile) {
                    const sheetImage = new Image();
                    sheetImage.onload = () => {
                        if (!sheetImage.naturalWidth || !sheetImage.naturalHeight) return;
                        // 圖片可能在切換年份／節點後才載入，避免回頭修改新的同名畫布。
                        if (canvasStates[uid] !== state || state.canvas !== canvas || !canvas.isConnected) return;
                        state.sheetRatio = sheetImage.naturalWidth / sheetImage.naturalHeight;
                        resizeCanvas(uid);
                        resizeExamBody(canvas);
                    };
                    sheetImage.src = `assets/exam_crops/${sheetFile}`;
                }
            }

            // 每次展開時重新 resize 確保寬高尺寸正確
            resizeCanvas(uid);
        }

        function resizeCanvas(uid) {
            const state = canvasStates[uid];
            if (!state) return;
            const canvas = state.canvas;
            const ctx = state.ctx;

            if (!canvas.isConnected) {
                disposeCanvasState(uid);
                return;
            }

            const container = canvas.parentElement;
            if (!container) return;
            const width = container.clientWidth || 500;

            const ratio = state.sheetRatio || 2.5;
            const height = width / ratio;

            // 備份現有內容以免 resize 後筆跡被清空
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tempCtx = tempCanvas.getContext('2d');
            if (canvas.width > 0 && canvas.height > 0) {
                tempCtx.drawImage(canvas, 0, 0);
            }

            const dpr = window.devicePixelRatio || 1;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            canvas.width = Math.max(1, Math.round(width * dpr));
            canvas.height = Math.max(1, Math.round(height * dpr));

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // 恢復畫筆與橡皮擦狀態
            if (state.tool === 'pen') {
                ctx.strokeStyle = '#1d4ed8'; // 大考常用原子筆藍色
                ctx.lineWidth = 2.5;
                ctx.globalCompositeOperation = 'source-over';
            } else {
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 15;
                ctx.globalCompositeOperation = 'destination-out';
            }

            // 貼回舊筆跡
            if (tempCanvas.width > 0 && tempCanvas.height > 0) {
                // 使用完整 backing store；除以 DPR 會只複製左上角。
                ctx.drawImage(tempCanvas, 0, 0, tempCanvas.width, tempCanvas.height, 0, 0, width, height);
            }
        }

        // 🎓 將多行自動換行文字精準繪製至 HTML5 Canvas 畫布
        function drawMultilineText(ctx, text, x, y, maxWidth, lineHeight) {
            ctx.save();
            ctx.globalCompositeOperation = 'source-over';
            ctx.font = 'bold 15px "PingFang TC", "Microsoft JhengHei", sans-serif';
            ctx.fillStyle = '#1d4ed8'; // 大考標準原子筆藍色
            ctx.textBaseline = 'top';

            const rawLines = text.split('\n');
            let currentY = y;

            rawLines.forEach(rawLine => {
                let currentLine = '';
                for (let i = 0; i < rawLine.length; i++) {
                    const char = rawLine[i];
                    const testLine = currentLine + char;
                    const metrics = ctx.measureText(testLine);
                    if (metrics.width > maxWidth && currentLine.length > 0) {
                        ctx.fillText(currentLine, x, currentY);
                        currentLine = char;
                        currentY += lineHeight;
                    } else {
                        currentLine = testLine;
                    }
                }
                if (currentLine) {
                    ctx.fillText(currentLine, x, currentY);
                    currentY += lineHeight;
                }
            });

            ctx.restore();
        }

        function addCanvasText(uid) {
            const state = canvasStates[uid];
            if (!state) return;
            state.tool = 'text';
            setCanvasTool(uid, 'text');
        }

        function startDrawing(e, uid) {
            const state = canvasStates[uid];
            if (!state) return;

            const rect = state.canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // 🎯 PPT 多行可調整寬度文字框：點擊畫布位置跳出可拖拉、自動換行的文字框
            if (state.tool === 'text') {
                const container = state.canvas.parentElement;

                // 清除前一個尚未提交的輸入框
                const oldInput = container.querySelector('.canvas-ppt-input-wrap');
                if (oldInput) oldInput.remove();

                const wrap = document.createElement('div');
                wrap.className = 'canvas-ppt-input-wrap';
                wrap.style.position = 'absolute';
                wrap.style.left = `${x}px`;
                wrap.style.top = `${y}px`;
                wrap.style.zIndex = '100';

                const availWidth = Math.max(220, Math.min(container.clientWidth - x - 20, 650));

                wrap.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; background:#2563EB; color:white; padding:3px 8px; border-radius:6px 6px 0 0; font-size:0.75rem; font-weight:bold; user-select:none;">
                        <span>🔤 可拉寬度文字框 (自動換行)</span>
                        <button type="button" class="commit-ppt-btn" style="background:#10B981; color:white; border:none; border-radius:3px; padding:2px 8px; cursor:pointer; font-size:0.75rem; font-weight:bold;">✅ 確定蓋印</button>
                    </div>
                    <textarea class="canvas-ppt-textarea" placeholder="請在此輸入長篇論述 (拖拉右下角可調整寬高，會自動換行)..." style="width:${availWidth}px; height:85px; font:bold 15px 'PingFang TC', 'Microsoft JhengHei', sans-serif; color:#1d4ed8; background:rgba(255,255,255,0.96); border:2px dashed #2563EB; border-radius:0 0 6px 6px; padding:6px 8px; outline:none; resize:both; box-shadow:0 6px 16px rgba(0,0,0,0.2); line-height:1.5; margin:0; display:block;"></textarea>
                `;

                const textarea = wrap.querySelector('.canvas-ppt-textarea');
                const commitBtn = wrap.querySelector('.commit-ppt-btn');

                let isCommitted = false;
                const commitText = () => {
                    if (isCommitted) return;
                    isCommitted = true;
                    const val = textarea.value.trim();
                    const currentBoxWidth = textarea.clientWidth - 18;
                    if (val) {
                        drawMultilineText(state.ctx, val, x, y + 26, currentBoxWidth, 22);
                        // 🎯 記錄打字內容，供評分引擎動態對照
                        state.recordedText = ((state.recordedText || '') + '\n' + val).trim();
                        const textEl = document.getElementById(`handwrite-text-${uid}`);
                        if (textEl) {
                            textEl.value = ((textEl.value || '') + '\n' + val).trim();
                        }
                    }
                    if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
                    state.tool = 'pen';
                    setCanvasTool(uid, 'pen');
                };

                commitBtn.addEventListener('click', (evt) => {
                    evt.stopPropagation();
                    commitText();
                });

                textarea.addEventListener('keydown', (evt) => {
                    if (evt.ctrlKey && evt.key === 'Enter') {
                        evt.preventDefault();
                        commitText();
                    }
                });

                container.appendChild(wrap);
                setTimeout(() => textarea.focus(), 20);
                return;
            }

            state.isDrawing = true;
            state.lastX = x;
            state.lastY = y;
        }

        function draw(e, uid) {
            const state = canvasStates[uid];
            if (!state || !state.isDrawing || state.tool === 'text') return;

            const rect = state.canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const ctx = state.ctx;
            ctx.beginPath();
            ctx.moveTo(state.lastX, state.lastY);
            ctx.lineTo(x, y);

            if (state.tool === 'pen') {
                ctx.strokeStyle = '#1d4ed8'; // 大考原子筆藍色
                ctx.lineWidth = 2.5;
                ctx.globalCompositeOperation = 'source-over';
            } else {
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 15;
                ctx.globalCompositeOperation = 'destination-out';
            }
            ctx.stroke();

            state.lastX = x;
            state.lastY = y;
        }

        function stopDrawing(uid) {
            const state = canvasStates[uid];
            if (state) state.isDrawing = false;
        }

        function setCanvasTool(uid, tool) {
            const state = canvasStates[uid];
            if (!state) return;
            state.tool = tool;

            const wrap = document.getElementById(`board-wrap-${uid}`);
            if (wrap) {
                wrap.querySelectorAll('.canvas-tool-btn').forEach(btn => {
                    if (btn.getAttribute('data-tool') === tool) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
            }
        }

        function clearCanvas(uid) {
            const state = canvasStates[uid];
            if (!state) return;
            const dpr = window.devicePixelRatio || 1;
            state.ctx.clearRect(0, 0, state.canvas.width / dpr, state.canvas.height / dpr);
        }

        function toggleWritingMode(uid) {
            const textEl = document.getElementById(`handwrite-text-${uid}`);
            const boardEl = document.getElementById(`board-wrap-${uid}`);
            const toggleBtn = document.getElementById(`toggle-mode-btn-${uid}`);

            if (textEl.style.display === 'none') {
                textEl.style.display = 'block';
                boardEl.style.display = 'none';
                toggleBtn.textContent = '✍️ 切換手寫板';
                resizeExamBody(toggleBtn);
            } else {
                textEl.style.display = 'none';
                boardEl.style.display = 'block';
                toggleBtn.textContent = '⌨️ 切換打字框';
                setTimeout(() => {
                    initCanvas(uid, '');
                    resizeExamBody(toggleBtn);
                }, 50);
            }
        }

        function toggleExamSol(btn, key) {
            const item = btn.closest('.exam-item');
            const box = btn.parentElement.querySelector('.exam-sol');
            const isHand = Boolean(examSolutions[key]?.hand);
            if (box.hasAttribute('hidden')) {
                box.removeAttribute('hidden');
                btn.textContent = isHand ? '📋 收合參考答案與評分規準' : '📖 收合答案與詳解';

                // 核對選擇題答案
                if (!isHand) checkExamMC(key, item);

                scheduleMathJax([box], { delay: 0, after: () => resizeExamBody(btn) });
            } else {
                box.setAttribute('hidden', '');
                btn.textContent = isHand ? '📋 顯示參考答案與評分規準' : '📖 顯示答案與詳解';

                // 重設選擇題答案以重新練習
                if (!isHand) resetExamMC(key, item);
            }
            resizeExamBody(btn);
        }

        function setExamYear(y) {
            examYearFilter = y;
            if (y !== 'all') loadedExamYears.add(y);
            renderExamsView();
        }

        function loadExamYear(year) {
            loadedExamYears.add(year);
            renderExamsView();
            requestAnimationFrame(() => {
                document.querySelector(`[data-exam-year="${year}"]`)?.scrollIntoView({ block: 'start' });
            });
        }

        function setShow99(v) {
            show99 = v;
            // 若關閉 99 課綱時正停在 99 課綱的篩選，退回全部
            if (!show99 && examYearFilter !== 'all' && examPapers[examYearFilter] && examPapers[examYearFilter].cur === '99') {
                examYearFilter = 'all';
            }
            if (currentView === 'stats') renderStatsView();
            else renderExamsView();
        }

        function toggleInvertCrops(v) {
            invertCrops = v;
            document.querySelectorAll('.exam-crop').forEach(img => {
                img.classList.toggle('inverted', invertCrops);
            });
        }

        // 從命題矩陣點某節點 → 跳到歷屆試題並篩選該節點
        function showExamsForNode(nodeId) {
            // 若該節點只有 99 課綱的題，自動開啟 99 課綱以免空白
            const cnt = nodeExamCounts(nodeId);
            if (cnt.c108 === 0 && cnt.c99 > 0) show99 = true;
            navigateTo(`exams-${nodeId}`);
        }
        function clearExamNode() {
            navigateTo('tool-exams');
        }

        // Initialize the hash router. A deep link opens directly; an empty URL lands on the study home.
        window.addEventListener('load', () => {
            buildNodeSidebar();
            const initialRoute = routeFromLocation();
            history.replaceState({ physicsApp: true, physicsRoute: initialRoute, physicsDepth: 0 }, '', `#${encodeURIComponent(initialRoute)}`);
            renderRoute(initialRoute);
            updateWrongNavBadge();
        });
        window.addEventListener('popstate', () => renderRoute(routeFromLocation()));
        window.addEventListener('hashchange', () => {
            const route = routeFromLocation();
            if (route !== lastRenderedRoute) renderRoute(route);
        });

    </script>
</body>
</html>
